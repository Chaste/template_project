name: Test Python Project

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

concurrency:
  group: test-python-project-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python-project:
    # Two configurations:
    #  - default-components: the python wrapper template exactly as shipped.
    #  - force-example: the python_example walkthrough.
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Prompt defaults (proceed, no optional components), yes to Python
          # bindings, no to SBML, yes to confirm
          - variant: default-components
            answers: '\n\n\n\n\ny\nn\ny\n'
          # Yes to proceed, yes to cell_based, no to crypt/heart/lung, yes to
          # Python bindings, no to SBML, yes to confirm
          - variant: force-example
            answers: 'y\ny\nn\nn\nn\ny\nn\ny\n'

    container:
      image: chaste/base
      options: --user root

    env:
      CHASTE_SOURCE_DIR: /tmp/Chaste
      CHASTE_BUILD_DIR: /tmp/build
      CHASTE_TEST_OUTPUT: /tmp/testoutput
      PROJECT_DIR: /tmp/myproject

    steps:
      - name: Checkout template
        uses: actions/checkout@v7

      - name: Checkout Chaste source
        run: |
          git clone --depth 1 --branch develop https://github.com/Chaste/Chaste.git "${CHASTE_SOURCE_DIR}"
          git config --global --add safe.directory "${CHASTE_SOURCE_DIR}"

      - name: Create test project
        run: |
          cp -r . ${{ env.PROJECT_DIR }}
          cd ${{ env.PROJECT_DIR }}
          printf '%b' '${{ matrix.answers }}' | python3 setup_project.py

      - name: Add MyForce to the project bindings
        if: matrix.variant == 'force-example'
        run: |
          cd ${{ env.PROJECT_DIR }}
          cp examples/python_example/MyForce.hpp examples/python_example/MyForce.cpp src/
          sed -i.bak 's/^    classes:$/&\n      - name: MyForce/' dynamic/config.yaml
          # Import PyChaste's module and declare AbstractForce as an external base
          sed -i.bak 's/^  - name: all$/&\n    imports:/' dynamic/config.yaml
          sed -i.bak 's/^    imports:$/&\n      - chaste._pychaste_all/' dynamic/config.yaml
          sed -i.bak 's/^      - chaste._pychaste_all$/&\n    external_bases:/' dynamic/config.yaml
          sed -i.bak 's/^    external_bases:$/&\n      - AbstractForce/' dynamic/config.yaml
          # The seds above anchor on the shipped formatting of config.yaml; fail loudly
          # here rather than later with a confusing "MyForce_2 not found" at runtime.
          grep -q '^      - name: MyForce$' dynamic/config.yaml
          grep -q '^      - chaste._pychaste_all$' dynamic/config.yaml
          grep -q '^      - AbstractForce$' dynamic/config.yaml

      - name: Configure
        run: ${{ env.PROJECT_DIR }}/scripts/configure.sh

      - name: Compile
        run: ${{ env.PROJECT_DIR }}/scripts/compile.sh

      - name: Install
        run: ${{ env.PROJECT_DIR }}/scripts/bindings_install.sh

      - name: Test Python bindings
        run: |
          ${{ env.PROJECT_DIR }}/.virtualenv/bin/python -c "
          import myproject
          h = myproject.Hello_myproject('Hello from Python!')
          message = h.GetMessage()
          assert message == 'Hello from Python!', f'Expected \"Hello from Python!\" but got \"{message}\"'
          print(f'GetMessage() returned: {message}')
          print('Test passed!')
          "

      - name: Run the MyForce simulation from Python
        if: matrix.variant == 'force-example'
        run: ${{ env.PROJECT_DIR }}/.virtualenv/bin/python ${{ env.PROJECT_DIR }}/examples/python_example/run_my_force.py
