# CPPWG configuration for template_project Python bindings.
# See https://chaste.github.io/cppwg/ for documentation, and the Chaste tree's own
# pychaste/dynamic/config.yaml for a large worked example. Add classes here as you add
# them to your project.

name: template_project

smart_ptr_type: boost::shared_ptr
pointer_call_policy: reference
reference_call_policy: reference_internal

common_include_file: OFF

# Automatically include the headers each wrapper needs. A class's own header is
# always included, so only extra headers need listing under source_includes.
auto_includes: True

# Skip bindings for methods that only override a virtual base class method that
# is already wrapped on the base class as these are redundant.
exclude_inherited_overrides: True

# Auto-include type-caster headers in wrappers that use their types. These are the
# casters pychaste ships; cppwg adds each one only to the wrappers that need it.
typecasters:
  - header: PybindPetscTypeCaster.hpp
    types: [Vec, Mat]
  - header: PybindUblasTypeCaster.hpp
    types: [boost::numeric::ublas::c_vector]
  - header: PybindVTKTypeCaster.hpp
    types: [vtkSmartPointer, vtkNew]

# Headers added to every class wrapper.
source_includes:
  - SmartPointers.hpp

# Wrap the explicit template instantiations declared in the project's own .cpp files,
# e.g. `template class MyForce<2>;` wraps MyForce as MyForce_2. If a class's
# instantiations cannot be discovered this way, list them per class instead with
# template_substitutions (see the cppwg docs on templates).
discover_template_instantiations: True
discover_arg_excludes:
  DIM: [0]
  SPACE_DIM: [0]
  ELEMENT_DIM: [0]

modules:
  - name: all
    # Where cppwg looks for the classes named below. If a header basename appears in more
    # than one scanned location the last match wins, ordered by path, so keep wrapped
    # headers in src/ rather than adding a location that sorts after it.
    source_locations:
      - src/
    classes:
      - name: Hello
